name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'provenance.json'
      - 'provenance.sigstore.json'
  workflow_dispatch:
    inputs:
      rejection_probe:
        description: Verify a corrupted synthetic copy is rejected, without deploying
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tree-pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify web package authenticity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tools_sha: ${{ steps.source.outputs.sha }}
      source_sha: ${{ steps.verification.outputs.source_sha }}
    steps:
      # Target scripts are publisher-controlled. Resolve tools independently.
      - name: Resolve trusted source tools
        id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            // Read a public branch over Git: no token, no REST API quota and one attempt.
            const head = (name, repository) => {
              const url = `https://github.com/${repository}.git`
              const args = ['-c', 'http.followRedirects=false', 'ls-remote', '--exit-code', url, 'refs/heads/main']
              // Pass no token and ignore user and system Git configuration.
              const settings = { GIT_TERMINAL_PROMPT: '0', GIT_CONFIG_NOSYSTEM: '1', GIT_CONFIG_GLOBAL: '/dev/null' }
              const env = { PATH: process.env.PATH, ...settings }
              let refs
              try {
                const options = { env, encoding: 'utf8', timeout: 15000, stdio: ['ignore', 'pipe', 'ignore'] }
                refs = require('node:child_process').execFileSync('git', args, options)
              } catch (error) {
                // Report only the exit status or error code. Never log Git or remote output.
                throw new Error(`Cannot read ${name} head (${error?.code ?? `exit ${error?.status}`})`)
              }
              // Accept exactly one line, for the main branch.
              const sha = /^([a-f0-9]{40})\trefs\/heads\/main$/.exec(refs.trim())?.[1]
              if (!sha) throw new Error(`Invalid ${name} head`)
              return sha
            }

            core.setOutput('sha', head('source', 'abtv/tree'))
      - name: Check out trusted tools at an immutable source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: abtv/tree
          ref: ${{ steps.source.outputs.sha }}
          path: release-tools
          persist-credentials: false
      - name: Check out candidate as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.13.1'
      - name: Install trusted verifier dependencies without lifecycle scripts
        working-directory: release-tools
        run: npm ci --ignore-scripts
      - name: Verify signature, all bytes and source gate
        id: verification
        if: ${{ !inputs.rejection_probe }}
        env:
          GH_TOKEN: ${{ github.token }}
          TREE_RELEASE_TOOLS_SHA: ${{ steps.source.outputs.sha }}
        run: node release-tools/scripts/web-release/verify-target.mts verify candidate
      - name: Verify rejection with the real signature and package checks
        if: inputs.rejection_probe
        env:
          GH_TOKEN: ${{ github.token }}
          TREE_RELEASE_TOOLS_SHA: ${{ steps.source.outputs.sha }}
        run: node release-tools/scripts/web-release/verify-target.mts rejection-probe candidate
      - name: Preserve authenticated metadata for hosted verification
        if: ${{ !inputs.rejection_probe }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-provenance
          path: |
            candidate/provenance.json
            candidate/provenance.sigstore.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload only the authenticated site
        if: ${{ !inputs.rejection_probe }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: candidate/site/

  deploy:
    name: Deploy web app to GitHub Pages
    needs: verify
    if: ${{ !inputs.rejection_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      # No checkout or repository-controlled executable code in this job.
      - name: Reject superseded candidates before deployment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        with:
          script: |
            // Read a public branch over Git: no token, no REST API quota and one attempt.
            const head = (name, repository) => {
              const url = `https://github.com/${repository}.git`
              const args = ['-c', 'http.followRedirects=false', 'ls-remote', '--exit-code', url, 'refs/heads/main']
              // Pass no token and ignore user and system Git configuration.
              const settings = { GIT_TERMINAL_PROMPT: '0', GIT_CONFIG_NOSYSTEM: '1', GIT_CONFIG_GLOBAL: '/dev/null' }
              const env = { PATH: process.env.PATH, ...settings }
              let refs
              try {
                const options = { env, encoding: 'utf8', timeout: 15000, stdio: ['ignore', 'pipe', 'ignore'] }
                refs = require('node:child_process').execFileSync('git', args, options)
              } catch (error) {
                // Report only the exit status or error code. Never log Git or remote output.
                throw new Error(`Cannot read ${name} head (${error?.code ?? `exit ${error?.status}`})`)
              }
              // Accept exactly one line, for the main branch.
              const sha = /^([a-f0-9]{40})\trefs\/heads\/main$/.exec(refs.trim())?.[1]
              if (!sha) throw new Error(`Invalid ${name} head`)
              return sha
            }

            const expected = process.env.EXPECTED_SOURCE_SHA
            if (!/^[a-f0-9]{40}$/.test(expected ?? '')) throw new Error('Missing verified source SHA')
            if (head('source', 'abtv/tree') !== expected) throw new Error('Source candidate superseded')
            // Read the target last, immediately before deployment.
            if (head('target', `${context.repo.owner}/${context.repo.repo}`) !== context.sha) {
              throw new Error('Target candidate superseded')
            }
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy the verified artifact from this run
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  hosted:
    name: Verify deployed web files
    needs: [verify, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: abtv/tree
          ref: ${{ needs.verify.outputs.tools_sha }}
          path: release-tools
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.13.1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-provenance
          path: verified-provenance
      - name: Install trusted verifier dependencies without lifecycle scripts
        working-directory: release-tools
        run: npm ci --ignore-scripts
      - name: Check signed expected bytes after deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node release-tools/scripts/web-release/verify-target.mts hosted verified-provenance
