name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'provenance.json'
      - 'provenance.sigstore.json'
  workflow_dispatch:
    inputs:
      rejection_probe:
        description: Verify a corrupted synthetic copy is rejected, without deploying
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tree-pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify web package authenticity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tools_sha: ${{ steps.source.outputs.sha }}
      source_sha: ${{ steps.verification.outputs.source_sha }}
    steps:
      # Target scripts are publisher-controlled. Resolve tools independently.
      - name: Resolve trusted source tools
        id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const response = await fetch('https://api.github.com/repos/abtv/tree/git/ref/heads/main', {
              redirect: 'error', signal: AbortSignal.timeout(15000)
            })
            if (!response.ok) throw new Error('Cannot resolve trusted source')
            const sha = (await response.json()).object?.sha
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid source SHA')
            core.setOutput('sha', sha)
      - name: Check out trusted tools at an immutable source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: abtv/tree
          ref: ${{ steps.source.outputs.sha }}
          path: release-tools
          persist-credentials: false
      - name: Check out candidate as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.13.1'
      - name: Verify signature, all bytes and source gate
        id: verification
        if: ${{ !inputs.rejection_probe }}
        env:
          GH_TOKEN: ${{ github.token }}
          TREE_RELEASE_TOOLS_SHA: ${{ steps.source.outputs.sha }}
        run: node release-tools/scripts/web-release/verify-target.mts verify candidate
      - name: Verify rejection with the real signature and package checks
        if: inputs.rejection_probe
        env:
          GH_TOKEN: ${{ github.token }}
          TREE_RELEASE_TOOLS_SHA: ${{ steps.source.outputs.sha }}
        run: node release-tools/scripts/web-release/verify-target.mts rejection-probe candidate
      - name: Preserve authenticated metadata for hosted verification
        if: ${{ !inputs.rejection_probe }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-provenance
          path: |
            candidate/provenance.json
            candidate/provenance.sigstore.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload only the authenticated site
        if: ${{ !inputs.rejection_probe }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: candidate/site/

  deploy:
    name: Deploy web app to GitHub Pages
    needs: verify
    if: ${{ !inputs.rejection_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      # No checkout or repository-controlled executable code in this job.
      - name: Reject superseded candidates before deployment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        with:
          script: |
            const target = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' })
            if (target.data.object.sha !== context.sha) throw new Error('Target candidate superseded')
            const response = await fetch('https://api.github.com/repos/abtv/tree/git/ref/heads/main', {
              redirect: 'error', signal: AbortSignal.timeout(15000)
            })
            if (!response.ok) throw new Error('Cannot check source head')
            if ((await response.json()).object?.sha !== process.env.EXPECTED_SOURCE_SHA) {
              throw new Error('Source candidate superseded')
            }
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy the verified artifact from this run
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  hosted:
    name: Verify deployed web files
    needs: [verify, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: abtv/tree
          ref: ${{ needs.verify.outputs.tools_sha }}
          path: release-tools
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.13.1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-provenance
          path: verified-provenance
      - name: Check signed expected bytes after deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node release-tools/scripts/web-release/verify-target.mts hosted verified-provenance
