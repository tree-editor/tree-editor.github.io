<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Security-Policy" content="default-src &#39;self&#39;; script-src &#39;self&#39;; style-src &#39;self&#39; &#39;unsafe-inline&#39;; img-src &#39;self&#39; blob: data:; font-src &#39;self&#39;; connect-src &#39;self&#39;; frame-src &#39;none&#39;; worker-src &#39;self&#39;; object-src &#39;none&#39;; base-uri &#39;none&#39;; form-action &#39;none&#39;">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbf8f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#3f3f3f" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Tree</title>
    <script type="module" crossorigin src="./assets/index-C8kDviuw.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BPK0RRpm.css">
  </head>
  <body>
    <button
      id="tree-menu-button"
      popovertarget="tree-menu"
      aria-label="Tree menu"
      title="Menu"
      data-editor-focus-borrow
    >
      ⋯
    </button>
    <div
      id="tree-menu"
      popover
      role="dialog"
      aria-label="Tree menu"
      data-popup-navigation="vertical"
      data-editor-focus-borrow
    >
      <button id="prototype-tree">Tree</button>
      <button id="prototype-agenda">Agenda</button>
      <hr />
      <div id="prototype-vim-controls" hidden>
        <button id="prototype-vim" aria-label="Vim Editing" aria-pressed="false">Vim Editing</button>
        <hr />
      </div>
      <span class="menu-label">Appearance</span>
      <button data-appearance="system" aria-label="Automatic" aria-pressed="true">Automatic</button>
      <button data-appearance="light" aria-label="Light" aria-pressed="false">Light</button>
      <button data-appearance="dark" aria-label="Dark" aria-pressed="false">Dark</button>
      <hr />
      <span class="menu-label">Data</span>
      <button id="data-export">Export Notes…</button>
      <button id="data-import">Import Notes…</button>
      <hr class="folder-actions-separator" />
      <button id="data-backup" hidden>Back Up to Folder…</button>
      <button id="data-restore" hidden>Restore from Folder…</button>
      <hr />
      <span id="prototype-save-status" role="status">Opening local document…</span>
      <span id="storage-status" role="status" hidden></span>
      <span id="backup-status" role="status" hidden></span>
    </div>
    <input id="data-import-file" type="file" accept=".zip,application/zip" hidden />
    <div id="data-activity" role="status" data-popup-navigation="horizontal" hidden>
      <span id="data-activity-text"></span>
      <button id="data-activity-action" type="button" data-popup-dismiss></button>
    </div>
    <!-- The explicit role lets the editor's global key handlers leave keys to the dialog, as for the menu. -->
    <dialog
      id="import-confirm"
      data-popup-navigation="horizontal"
      role="dialog"
      aria-labelledby="import-confirm-title"
      aria-describedby="import-confirm-incoming import-confirm-current import-confirm-missing"
    >
      <h2 id="import-confirm-title">Replace Current Notes?</h2>
      <p id="import-confirm-incoming"></p>
      <p id="import-confirm-current"></p>
      <p id="import-confirm-missing" hidden></p>
      <p id="import-confirm-status" role="status"></p>
      <div class="dialog-buttons">
        <button id="import-confirm-export" type="button">Export Current Notes First</button>
        <button id="import-confirm-replace" type="button">Replace Notes</button>
        <button id="import-confirm-cancel" type="button" class="default-button">Cancel</button>
      </div>
    </dialog>
    <div id="prototype-problem" role="alert" hidden></div>
    <dialog
      id="backup-confirm"
      data-popup-navigation="horizontal"
      role="dialog"
      aria-labelledby="backup-confirm-title"
      aria-describedby="backup-confirm-text"
    >
      <h2 id="backup-confirm-title"></h2>
      <p id="backup-confirm-text"></p>
      <div class="dialog-buttons">
        <button id="backup-confirm-restore" type="button">Restore from This Folder</button>
        <button id="backup-confirm-replace" type="button">Replace Backup with Current Notes</button>
        <button id="backup-confirm-resume" type="button" hidden>Resume Backing Up</button>
        <button id="backup-confirm-stop" type="button" hidden>Stop Backing Up</button>
        <button id="backup-confirm-choose" type="button">Choose Another Folder</button>
        <button id="backup-confirm-cancel" type="button" class="default-button">Cancel</button>
      </div>
    </dialog>
    <div id="root"></div>
  </body>
</html>
